# Stain settings shared by extract_features.py and plot_stain_example.py

stain:
  # Macenko normalisation target
  reference: null          # path to the reference patch; null = pick one automatically
  reference_label: TUM     # auto-pick: first training patch of this class

  # Controlled stain shift simulating a lab with different staining.
  # Applied in haematoxylin-eosin-DAB (HED) colour space to every patch in the same way:
  #   H' = H * h_scale + h_bias      E' = E * e_scale + e_bias
  # 1.0 / 0.0 leaves the image unchanged.
  shift:
    h_scale: 1.4           # stronger haematoxylin (nuclei darker, bluer)
    e_scale: 0.6           # weaker eosin (cytoplasm and stroma paler)
    h_bias: 0.0
    e_bias: 0.0
